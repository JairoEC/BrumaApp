spring.application.name=bruma-ms-gateway
server.port=8089

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=ms-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-auth
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=ms-gestion-pedidos
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-gestion-pedidos
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/pedidos/**

spring.cloud.gateway.server.webflux.routes[2].id=ms-atencion-pedidos
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms-atencion-pedidos
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/mesas/**,/api/empleados/**,/api/productos/**

spring.cloud.gateway.server.webflux.routes[3].id=ms-facturacion
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ms-facturacion
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/facturas/**way.routes[3].predicates[0]=Path=/api/facturas/**