<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-warning text-darken"> Menú e Inventario</h2>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevoProducto">
      + Nuevo Producto
    </button>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th class="ps-3">Producto y Descripción</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th class="text-center pe-3">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let prod of listaProductos">
              <td class="ps-3">
                <div class="fw-bold text-dark">{{ prod.nombre }}</div>
                <div class="text-muted small" style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                  {{ prod.descripcion }}
                </div>
              </td>
              <td><span class="badge bg-secondary">{{ prod.categoria }}</span></td>
              <td class="fw-bold text-success">S/ {{ prod.precio | number:'1.2-2' }}</td>
              <td>
                <span class="badge" [ngClass]="{'bg-danger': prod.stock <= 10, 'bg-primary': prod.stock > 10}">
                  {{ prod.stock }} und.
                </span>
              </td>
              <td class="text-center pe-3">
                <button (click)="prepararEditar(prod)" class="btn btn-sm btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#modalEditarProducto">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button (click)="eliminarProducto(prod.id)" class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash3"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalNuevoProducto" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Registrar Nuevo Producto</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form #formProducto="ngForm" (ngSubmit)="guardarProducto()">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Nombre del Producto *</label>
              <input type="text" class="form-control" name="nombre" [(ngModel)]="nuevoProducto.nombre" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Categoría *</label>
              <select class="form-select" name="categoria" [(ngModel)]="nuevoProducto.categoria" required>
                <option value="Bebidas Calientes">Bebidas Calientes</option>
                <option value="Bebidas Frías">Bebidas Frías</option>
                <option value="Postres">Postres</option>
                <option value="Snacks">Snacks</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Precio (S/) *</label>
              <input type="number" step="0.10" min="0" class="form-control" name="precio" [(ngModel)]="nuevoProducto.precio" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Stock Inicial *</label>
              <input type="number" min="0" class="form-control" name="stock" [(ngModel)]="nuevoProducto.stock" required>
            </div>
            <div class="col-12">
              <label class="form-label">Descripción</label>
              <textarea class="form-control" rows="2" name="descripcion" [(ngModel)]="nuevoProducto.descripcion"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-success" [disabled]="formProducto.invalid" data-bs-dismiss="modal">Guardar Producto</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="modalEditarProducto" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" *ngIf="productoSeleccionado">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Editar Producto</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form #formEditProducto="ngForm" (ngSubmit)="guardarEdicion()">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Nombre del Producto *</label>
              <input type="text" class="form-control" name="editNombre" [(ngModel)]="productoSeleccionado.nombre" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Categoría *</label>
              <select class="form-select" name="editCategoria" [(ngModel)]="productoSeleccionado.categoria" required>
                <option value="Bebidas Calientes">Bebidas Calientes</option>
                <option value="Bebidas Frías">Bebidas Frías</option>
                <option value="Postres">Postres</option>
                <option value="Snacks">Snacks</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Precio (S/) *</label>
              <input type="number" step="0.10" min="0" class="form-control" name="editPrecio" [(ngModel)]="productoSeleccionado.precio" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Stock *</label>
              <input type="number" min="0" class="form-control" name="editStock" [(ngModel)]="productoSeleccionado.stock" required>
            </div>
            <div class="col-12">
              <label class="form-label">Descripción</label>
              <textarea class="form-control" rows="2" name="editDescripcion" [(ngModel)]="productoSeleccionado.descripcion"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="formEditProducto.invalid" data-bs-dismiss="modal">Actualizar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>
