<div class="min-vh-100 d-flex align-items-center justify-content-center bg-dark">
  <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
      <h2 class="fw-bold">☕ Bruma</h2>
      <p class="text-muted">Inicia sesión para continuar</p>
    </div>
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" class="form-control" [(ngModel)]="credentials.username" placeholder="Ingresa tu usuario">
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control" [(ngModel)]="credentials.password" placeholder="Ingresa tu contraseña">
    </div>
    <div *ngIf="errorMsg" class="alert alert-danger py-2">{{ errorMsg }}</div>
    <button class="btn btn-dark w-100 mt-2" (click)="login()">Ingresar</button>
  </div>
</div>
