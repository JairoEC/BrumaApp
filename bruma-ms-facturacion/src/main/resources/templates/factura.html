<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { width: 80%; margin: 20px auto; border: 1px solid #ddd; padding: 20px; }
        .header { background: #f4f4f4; padding: 10px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f8f8; }
        .total { font-size: 1.2em; font-weight: bold; text-align: right; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Factura N° <span th:text="${factura.id}">000</span></h2>
    </div>
    <p>Hola, gracias por su compra. Adjuntamos el detalle de su pedido.</p>

    <p><strong>Fecha:</strong> <span th:text="${#temporals.format(factura.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span></p>
    <p><strong>Cliente ID:</strong> <span th:text="${factura.idCliente}"></span></p>

    <table>
        <thead>
        <tr>
            <th>Cantidad</th>
            <th>Precio Unitario</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="detalle : ${factura.detalleFactura}">
            <td th:text="${detalle.cantidad}">1</td>
            <td th:text="${#numbers.formatCurrency(detalle.precioUnitario)}">$0.00</td>
            <td th:text="${#numbers.formatCurrency(detalle.subTotal)}">$0.00</td>
        </tr>
        </tbody>
    </table>

    <p class="total">Total: <span th:text="${#numbers.formatCurrency(factura.total)}">$0.00</span></p>
</div>
</body>
</html>
