spring.application.name=bruma-ms-atencion-pedidos

spring.datasource.url=jdbc:mysql://localhost:3306/bd_BrumaEmpleados
spring.datasource.username=root
spring.datasource.password=mysql

eureka.client.enabled=false

# Habilita la actualización automática de la base de datos
spring.jpa.hibernate.ddl-auto=update

# Opcional: Para ver en la consola el SQL que genera JPA (ayuda mucho a aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Especifica el dialecto (ejemplo para MySQL 8+)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect